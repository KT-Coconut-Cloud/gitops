apiVersion: v1
kind: ServiceAccount
metadata:
  name: pii-pipeline
---
# Argo 실행기가 단계 결과를 보고하는 데 필요한 최소 권한
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pii-pipeline
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pii-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pii-pipeline
subjects:
  - kind: ServiceAccount
    name: pii-pipeline
