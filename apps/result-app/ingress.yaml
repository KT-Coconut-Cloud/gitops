apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: result-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: result.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: result-app
                port:
                  name: http
    # fallback for http://localhost:8081 when localtest.me does not resolve
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: result-app
                port:
                  name: http
