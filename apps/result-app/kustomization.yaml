apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app

labels:
  - pairs:
      app.kubernetes.io/name: result-app
    includeSelectors: true

resources:
  - deployment.yaml
  - service.yaml

images:
  - name: result-app
    newName: ghcr.io/kt-coconut-cloud/result-app
    newTag: "dev"
